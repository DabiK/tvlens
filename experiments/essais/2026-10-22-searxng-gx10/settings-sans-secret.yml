# SearXNG pour les essais TVLens (22/10) : écoute locale seulement, API JSON active, pas de limiteur.
use_default_settings: true
server:
  secret_key: "<secret local, hors dépôt>"
  limiter: false
  image_proxy: false
  public_instance: false
search:
  safe_search: 0
  default_lang: fr-FR
  formats:
    - html
    - json
engines:
  - name: bing
    disabled: false
  - name: yahoo
    disabled: false
  - name: qwant
    disabled: false
  - name: mojeek
    disabled: false
  - name: startpage
    disabled: false
