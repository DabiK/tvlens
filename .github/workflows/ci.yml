name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualité (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14.2"
      - name: Installer FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Installer FFmpeg (Mac)
        if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - run: npm ci
      - name: Contrôle complet et comparaison avec la base
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base=$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)
          fi
          npm run ci:check -- --base "$base" --report "$RUNNER_TEMP/quality.json"
      - name: Tests Python de la télécommande
        run: python3 -B -m unittest discover -s prototypes/lg-remote -p 'test_*.py'
      - name: Conserver le rapport qualité
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quality-${{ matrix.os }}
          path: ${{ runner.temp }}/quality.json
          retention-days: 14

  mac:
    name: Paquet Mac Apple Silicon
    needs: quality
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: command -v ffmpeg || brew install ffmpeg
      - run: npm ci
      - name: Parcours Electron avec capture et fournisseurs simulés
        run: |
          npm run test:electron
          npm run test:electron:identity
          npm run test:electron:setup
          npm run test:electron:config
      - name: Construire depuis un dépôt propre
        run: npm run package:mac -- --require-clean
      - name: Inspecter le paquet et charger son module natif
        run: npm run verify:mac -- dist/TVLens-darwin-arm64/TVLens.app --require-clean --report dist/package-report.json
      - name: Préparer le téléchargement
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/TVLens-darwin-arm64/TVLens.app dist/TVLens-mac-arm64.zip
          cd dist
          shasum -a 256 TVLens-mac-arm64.zip > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: TVLens-mac-arm64-${{ github.sha }}
          path: |
            dist/TVLens-mac-arm64.zip
            dist/package-report.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  required:
    name: CI complète
    if: always()
    needs: [quality, mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Exiger tous les contrôles
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          MAC_RESULT: ${{ needs.mac.result }}
        run: test "$QUALITY_RESULT" = success && test "$MAC_RESULT" = success
