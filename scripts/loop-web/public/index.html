<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QG de la boucle</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Silkscreen:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header class="top">
  <div class="brand"><i></i>QG DE LA BOUCLE</div>
  <span class="project" id="project"></span>
  <div class="spacer"></div>
  <span class="live" id="live"><b></b>CONNEXION</span>
</header>

<main class="hero">
  <section class="arena">
    <canvas id="scene" aria-label="Le bureau des agents de la boucle"></canvas>
    <div class="hud">
      <button class="stage" id="hudStage" title="Voir la fiche de la quête"></button>
      <button class="score" id="hudScore" title="Ouvrir le coffre"></button>
      <button class="quests" id="hudQuests">QUÊTES <b id="hudQuestsCount"></b></button>
      <div class="steps" id="steps"></div>
      <div class="banner" id="banner"></div>
    </div>
  </section>
  <aside class="term" aria-label="Fil en direct des agents">
    <nav class="cast" id="cast" role="tablist"></nav>
    <div class="term-head" id="termHead"></div>
    <div class="term-body" id="termBody"></div>
    <div class="term-foot">
      <span>Clique un agent pour suivre son fil.</span>
      <button class="jump" id="jump">↓ DIRECT</button>
    </div>
  </aside>
</main>

<dialog class="boardmodal" id="boardModal">
  <header>
    <h2>QUÊTES <small id="countBoard"></small></h2>
    <div class="tools">
      <div class="seg" id="filterSeg">
        <button data-filter="all" aria-pressed="true">TOUTES</button>
        <button data-filter="decision" aria-pressed="false">TA DÉCISION</button>
        <button data-filter="ready" aria-pressed="false">PRÊTES</button>
      </div>
      <input id="search" placeholder="Chercher une quête">
      <button class="close" id="closeBoard">FERMER</button>
    </div>
  </header>
  <div id="board" class="board"></div>
</dialog>
<dialog class="sheet" id="sheet"><div class="sheet-body" id="sheetBody"></div></dialog>
</body>
</html>
